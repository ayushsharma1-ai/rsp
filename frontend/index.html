<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      /* Version routing (runs before the app bundle loads):
         v3 (/v3.html) is the responsive app for EVERY device — phone and desktop.
         v1 (this page) is the legacy desktop UI, being retired. It's only shown if
         you explicitly pin it by opening the site once with ?desktop.
         Un-pin (go back to v3) with ?mobile. */
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          if (p.has('desktop')) localStorage.setItem('rsp-view', 'desktop');
          if (p.has('mobile'))  localStorage.removeItem('rsp-view');  // clear pin → back to v3
          if (localStorage.getItem('rsp-view') === 'desktop') return; // pinned to legacy v1 → stay
          location.replace('/v3.html');                               // everyone else → v3
        } catch (e) { /* if anything fails, just show v1 */ }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
