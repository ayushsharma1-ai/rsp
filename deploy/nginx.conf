# ============================================================================
#  RSP — nginx site config   →  /etc/nginx/sites-available/rsp
#  (symlink it into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`)
#
#  What this file does, top to bottom:
#    1. Redirects all plain HTTP (port 80) to HTTPS (port 443).
#    2. Terminates TLS (does the HTTPS encryption) with your certificate.
#    3. Serves the built React files (the website) from disk.
#    4. Forwards only /api/* to the FastAPI backend running on localhost:8000.
#    5. Adds security headers and blocks access to hidden/sensitive files.
#
#  Replace  scheduler.iitk.ac.in  with YOUR real domain everywhere below.
#  Replace the two ssl_certificate paths if you are not using certbot's defaults.
# ============================================================================

# ---- The backend (FastAPI/uvicorn). It listens ONLY on localhost, never public.
upstream rsp_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# 1) Port 80 (plain HTTP): send everyone to HTTPS.
#    The one exception is the ACME path Let's Encrypt uses to prove you own the
#    domain when issuing/renewing the certificate — that must stay on HTTP.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name scheduler.iitk.ac.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;          # certbot writes its proof file here
    }

    location / {
        return 301 https://$host$request_uri;   # 301 = permanent redirect to HTTPS
    }
}

# ---------------------------------------------------------------------------
# 2) Port 443 (HTTPS): the real site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scheduler.iitk.ac.in;

    # ---- TLS certificate (the two files that make the padlock work) ----------
    # These paths are certbot's defaults. `fullchain.pem` = your cert + the CA
    # chain; `privkey.pem` = your PRIVATE key (keep secret, never commit/share).
    ssl_certificate     /etc/letsencrypt/live/scheduler.iitk.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scheduler.iitk.ac.in/privkey.pem;

    # ---- Only modern, safe TLS. Disables old SSL/TLS 1.0/1.1 (VAPT requires this).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;         # let modern clients pick TLS1.3 ciphers
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Don't advertise the exact nginx version in responses/errors (info disclosure).
    server_tokens off;

    # ---- Security headers ----------------------------------------------------
    # HSTS: after the first visit, browsers refuse plain HTTP for this site for
    # 2 years. Only turn this on once HTTPS definitely works (it is sticky).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;   # no MIME-type guessing
    add_header X-Frame-Options           "DENY"    always;   # no embedding in iframes (anti-clickjacking)
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy: whitelist of where the page may load things from.
    #  - script 'unsafe-inline' is needed for the small device-redirect <script>
    #    inline in index.html. To fully harden later, move that to an external
    #    file and drop 'unsafe-inline' from script-src (VAPT may flag it).
    #  - style 'unsafe-inline' is needed for React inline style={{...}} attributes.
    #  - fonts.googleapis.com / fonts.gstatic.com are the Google Fonts the UI uses.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- Uploads / body size (feedback, etc.). Adjust if you add file uploads.
    client_max_body_size 5m;

    # ---- gzip: compress text responses so pages load faster ------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- Where the built frontend lives (output of `npm run build` = dist/) ---
    root /var/www/rsp;
    index index.html;

    # ---- API → FastAPI. Everything under /api is forwarded to uvicorn ---------
    location /api/ {
        proxy_pass http://rsp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # so the app knows it's HTTPS
        proxy_read_timeout 60s;
    }

    # health check straight to the backend (handy for uptime monitors)
    location = /health {
        proxy_pass http://rsp_backend;
        access_log off;
    }

    # ---- Long-cache the fingerprinted build assets (they never change content)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Never serve dotfiles (.env, .git, etc.) — 404 them --------------------
    location ~ /\. {
        deny all;
        return 404;
    }

    # ---- SPA routing -----------------------------------------------------------
    # v1 (desktop) uses BrowserRouter, so deep links like /bookings must fall back
    # to index.html and let React render the route. Real files (v3.html, assets)
    # are served directly. v3 uses HashRouter so it needs no fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
