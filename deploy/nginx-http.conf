# ============================================================================
#  RSP — nginx site config for the CURRENT state (RHEL, HTTP only, no domain yet)
#  Install to:  /etc/nginx/conf.d/rsp.conf
#
#  nginx serves the built frontend from /var/www/rsp and proxies /api to the app
#  on 127.0.0.1:8000. No TLS here — once the domain is arranged, swap this for
#  deploy/nginx.conf (which adds HTTPS, HSTS and certbot paths).
#
#  RHEL notes:
#   - RHEL's /etc/nginx/nginx.conf does `include /etc/nginx/conf.d/*.conf;` BEFORE
#     its own default server block, so this becomes the default site for port 80.
#     If you still see the nginx welcome page, see DEPLOY notes (add default_server
#     here, or disable the built-in block).
#   - SELinux is enforcing: you MUST run the two commands in the runbook
#     (httpd_can_network_connect + labelling /var/www/rsp) or nginx will 502/403.
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    # ---- security headers (no HSTS yet — that belongs with HTTPS) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # script/style 'unsafe-inline': the device-redirect script in index.html and
    # React's inline style attributes. fonts.* are the Google Fonts the UI loads
    # (fetched by the visitor's browser, not the server).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    root /var/www/rsp;
    index index.html;

    # ---- API -> the app on localhost ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # fingerprinted build assets never change content -> cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # never serve dotfiles (.env, .git, ...)
    location ~ /\. { deny all; return 404; }

    # v3 uses hash routing, so real files are served directly; v1 deep links fall
    # back to index.html (which redirects to /v3.html).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
